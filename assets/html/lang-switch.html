<script>
// Language switch. The navbar link (rel="alternate", declared in _quarto-en.yml /
// _quarto-pt.yml) ships with a static href pointing at the other language's home.
// This upgrades it to the counterpart of the *current* page, and emits the
// matching hreflang <link>s.
//
// Degradation is deliberate: if the fetch fails (opening docs/ over file://, for
// instance) the static home href stays and the button still works.
(function () {
  var link = document.querySelector('.navbar a.nav-link[rel="alternate"]');
  if (!link) return;

  var isPT = document.documentElement.lang === "pt";

  // Derive both site roots from the href Quarto already resolved for this page's
  // depth - more reliable than assuming the site is served from the domain root.
  var declared = new URL(link.getAttribute("href"), location.href).pathname;
  var enRoot = isPT
    ? declared.replace(/index\.html$/, "")
    : declared.replace(/pt\/index\.html$/, "");
  var ptRoot = enRoot + "pt/";

  var here = isPT ? ptRoot : enRoot;
  var there = isPT ? enRoot : ptRoot;
  if (location.pathname.indexOf(here) !== 0) return;
  var rel = location.pathname.slice(here.length) || "index.html";

  // Match on the slug with the .pt suffix made optional, rather than on the raw
  // path: a post's EN file drops the .pt (0001-x.pt.qmd -> 0001-x.qmd), so once
  // it is translated the two trees stop mirroring each other path-for-path.
  //
  // Not matched on the numeric prefix - it is a *series* number here, shared by
  // every part of a multi-post series (0001-...-pt1-, 0001-...-pt2-).
  var stem = rel.replace(/\.html$/, "").replace(/\.pt$/, "");
  var isPost = rel.indexOf("blog/") === 0 && rel !== "blog/index.html";

  fetch(there + "search.json")
    .then(function (r) { return r.json(); })
    .then(function (entries) {
      var pages = {};
      entries.forEach(function (e) { pages[e.href.split("#")[0]] = true; });

      // Both profiles render every post, so each tree holds both language files.
      // Prefer the one actually written in the target language; the other is the
      // untranslated placeholder and only wins when the preferred one is absent.
      var order = isPT
        ? [stem + ".html", stem + ".pt.html"]   // going to EN
        : [stem + ".pt.html", stem + ".html"];  // going to PT
      var target = order.filter(function (c) {
        return pages[c];
      })[0] || (isPost ? "blog/index.html" : "index.html");

      link.setAttribute("href", there + target);

      var alt = document.createElement("link");
      alt.rel = "alternate";
      alt.hreflang = isPT ? "en" : "pt";
      alt.href = new URL(there + target, location.href).href;
      document.head.appendChild(alt);

      var self = document.createElement("link");
      self.rel = "alternate";
      self.hreflang = isPT ? "pt" : "en";
      self.href = location.href.split("#")[0];
      document.head.appendChild(self);
    })
    .catch(function () { /* keep the static home fallback */ });
})();
</script>
